<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Registration / Service Request Form</title>
</head>
<body>

  <h1>Company Registration / Service Request Form</h1>

  <form method="post" action="#">

    <!-- ========== 1. PERSONAL INFORMATION ========== -->
    <fieldset>
      <legend>1. Personal Information</legend>

      <p>
        <label for="full-name">Full Name </label><br>
        <input type="text" id="full-name" name="full_name"
               required minlength="1" maxlength="40"
               pattern="[A-Za-z][A-Za-z\s.'\-]+"
               title="Letters, spaces, apostrophes, dots and hyphens only (2-60 characters)">
      </p>

      <p>
        <label for="email">Email Address </label><br>
        <input type="email" id="email" name="email"
               required maxlength="100">
      </p>

      <p>
        <label for="phone">Phone Number </label><br>
        <input type="tel" id="phone" name="phone"
               required minlength="10" maxlength="15"
               pattern="[0-9+\s\-]{10,15}"
               title="10 to 15 characters: digits, +, spaces or hyphens">
      </p>
    </fieldset>

    <br>

    <!-- ========== 2. COMPANY INFORMATION ========== -->
    <fieldset>
      <legend>2. Company Information</legend>

      <p>
        <label for="company-name">Company Name </label><br>
        <input type="text" id="company-name" name="company_name"
               required minlength="2" maxlength="80">
      </p>

      <p>
        <label for="company-website">Company Website</label><br>
        <input type="url" id="company-website" name="company_website"
               maxlength="150" pattern="https?://.+"
               title="Must start with http:// or https://">
      </p>

      <p>
        <label for="company-size">Company Size </label><br>
        <select id="company-size" name="company_size" required>
          <option value="">-- Select company size --</option>
          <option value="1-10">1 - 10 employees</option>
          <option value="11-50">11 - 50 employees</option>
          <option value="51-200">51 - 200 employees</option>
          <option value="201-500">201 - 500 employees</option>
          <option value="500+">500+ employees</option>
        </select>
      </p>

      <p>
        <label for="industry">Industry </label><br>
        <input type="text" id="industry" name="industry"
               required minlength="3" maxlength="50"
               pattern="[A-Za-z][A-Za-z\s&amp;,\-]+"
               title="Letters, spaces, &amp;, commas and hyphens only">
      </p>
    </fieldset>

    <br>

    <!-- ========== 3. SERVICE REQUEST ========== -->
    <fieldset>
      <legend>3. Service Request</legend>

      <fieldset>
        <legend>Service Type </legend>
        <input type="radio" id="service-consulting" name="service_type" value="consulting" required>
        <label for="service-consulting">Consulting</label><br>

        <input type="radio" id="service-development" name="service_type" value="development">
        <label for="service-development">Software Development</label><br>

        <input type="radio" id="service-support" name="service_type" value="support">
        <label for="service-support">Technical Support</label><br>

        <input type="radio" id="service-training" name="service_type" value="training">
        <label for="service-training">Training</label>
      </fieldset>

      <br>

      <fieldset>
        <legend>Preferred Contact Method</legend>
        <input type="checkbox" id="contact-email" name="contact_method" value="email">
        <label for="contact-email">Email</label><br>

        <input type="checkbox" id="contact-phone" name="contact_method" value="phone">
        <label for="contact-phone">Phone Call</label><br>

        <input type="checkbox" id="contact-sms" name="contact_method" value="sms">
        <label for="contact-sms">SMS</label>
      </fieldset>

      <p>
        <label for="appointment-date">Appointment Date </label><br>
        <input type="date" id="appointment-date" name="appointment_date"
               required min="2026-10-16" max="2027-12-31">
      </p>

      <p>
        <label for="appointment-time">Appointment Time  (08:00 - 17:00)</label><br>
        <input type="time" id="appointment-time" name="appointment_time"
               required min="08:00" max="17:00">
      </p>

      <p>
        <label for="budget">Budget Range (USD, 100 - 100000) </label><br>
        <input type="number" id="budget" name="budget"
               required min="100" max="100000" step="50">
      </p>
    </fieldset>

    <br>

    <!-- ========== 4. MESSAGE AND AGREEMENT ========== -->
    <fieldset>
      <legend>4. Message and Agreement</legend>

      <p>
        <label for="message">Additional Information</label><br>
        <textarea id="message" name="message"
                  rows="6" cols="50"
                  minlength="10" maxlength="500"
                  placeholder="Tell us more about your request (10-50 characters)"></textarea>
      </p>

      <p>
        <input type="checkbox" id="terms" name="terms" value="accepted" required>
        <label for="terms">I agree to the Terms and Conditions *</label>
      </p>
    </fieldset>

    <br>

    <p>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </p>

  </form>

</body>
</html>
